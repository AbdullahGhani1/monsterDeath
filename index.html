<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>THE ABYSS</title>
    <link rel="stylesheet" href="/assets/styles/app.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@800;900&family=Inter:wght@400;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body>
    <!-- Game Background -->
    <canvas id="game-canvas"></canvas>

    <!-- Visual Effects Layer -->
    <div id="hit-flash" class="hit-flash"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
      <!-- Top App Bar -->
      <header class="top-bar">
        <div class="logo">THE ABYSS</div>
        <div class="top-actions">
          <span class="material-symbols-outlined" style="color: var(--color-abyss-bronze); cursor: pointer;">settings</span>
        </div>
      </header>

      <!-- Main Shell -->
      <div class="ui-shell">
        <!-- Left: Vitals (Desktop) -->
        <aside class="left-panel">
          <div class="panel">
            <div class="panel-header">
              <span>VANGUARD</span>
              <span style="color: var(--color-secondary)">LVL 01</span>
            </div>
            <div class="vital-row">
              <div class="vital-label">INTEGRITY</div>
              <div class="bar-container">
                <div id="player-health-bar" class="bar-fill hp-fill" style="width: 100%;"></div>
              </div>
            </div>
            <div class="vital-row">
              <div class="vital-label">STAMINA</div>
              <div class="bar-container">
                <div id="player-stamina-bar" class="bar-fill stamina-fill" style="width: 100%;"></div>
              </div>
            </div>
          </div>
          <div class="panel" style="margin-top: auto;">
            <div class="panel-header">
              <span style="color: var(--color-error)">HOSTILE</span>
              <span class="material-symbols-outlined" style="font-size: 14px; color: var(--color-error)">skull</span>
            </div>
            <div class="bar-container">
              <div id="monster-health-bar" class="bar-fill hp-fill" style="width: 0%;"></div>
            </div>
          </div>
        </aside>

        <!-- Center: Game Feedback -->
        <section class="center-content">
          <!-- Mobile-only vitals -->
          <div class="mobile-vitals">
            <div class="mini-panel">
              <div class="vital-label">HP</div>
              <div class="bar-container"><div id="m-player-health" class="bar-fill hp-fill" style="width: 100%;"></div></div>
            </div>
            <div class="mini-panel">
              <div class="vital-label">STM</div>
              <div class="bar-container"><div id="m-player-stamina" class="bar-fill stamina-fill" style="width: 100%;"></div></div>
            </div>
          </div>
          
          <div id="interaction-prompt" style="display: none; margin-top: auto; margin-bottom: 20px;">
            PRESS [SPACE] TO INTERACT
          </div>
        </section>

        <!-- Right: Log (Desktop) -->
        <aside class="right-panel">
          <div class="terminal">
            <div class="terminal-header">
              <span>LOG_SEQ.05</span>
              <span class="material-symbols-outlined" style="font-size: 14px;">terminal</span>
            </div>
            <div id="log-body" class="terminal-body">
              <div class="log-entry system">&gt; Connection established...</div>
              <div class="log-entry system">&gt; Phase 5 systems: ONLINE</div>
            </div>
          </div>
        </aside>
      </div>

      <!-- Action Grid -->
      <div class="action-grid">
        <button class="action-btn" id="btn-strike">
          <span class="material-symbols-outlined">swords</span>
          STRIKE
        </button>
        <button class="action-btn" id="btn-guard">
          <span class="material-symbols-outlined">shield</span>
          GUARD
        </button>
        <button class="action-btn" id="btn-nvg">
          <span class="material-symbols-outlined">visibility</span>
          EYE
        </button>
        <button class="action-btn destructive" id="btn-retreat">
          <span class="material-symbols-outlined">directions_run</span>
          RETREAT
        </button>
      </div>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <button class="nav-item active" id="nav-battle">
          <span class="material-symbols-outlined">swords</span>
          <span class="nav-label">BATTLE</span>
        </button>
        <button class="nav-item" id="nav-pda">
          <span class="material-symbols-outlined">backpack</span>
          <span class="nav-label">PDA</span>
        </button>
        <button class="nav-item">
          <span class="material-symbols-outlined">explore</span>
          <span class="nav-label">MAP</span>
        </button>
        <button class="nav-item">
          <span class="material-symbols-outlined">fireplace</span>
          <span class="nav-label">CAMP</span>
        </button>
      </nav>
    </div>

    <!-- PDA Modal -->
    <div id="pda-modal" style="display: none; position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); padding: 40px;">
      <div class="panel" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
        <div class="panel-header" style="border-bottom: 1px solid var(--color-abyss-bronze-muted); padding-bottom: 10px;">
          <span>SYSTEM_PDA_V.1.5</span>
          <button id="pda-close" style="background:none; border:none; color:var(--color-error); cursor:pointer;">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        
        <!-- PDA Tabs -->
        <div style="display: flex; gap: 10px; margin: 20px 0;">
          <button class="action-btn" id="tab-inv" style="flex:1; height: 40px;">INVENTORY</button>
          <button class="action-btn" id="tab-craft" style="flex:1; height: 40px;">CRAFTING</button>
          <button class="action-btn" id="tab-mission" style="flex:1; height: 40px;">MISSIONS</button>
        </div>

        <!-- Tab Content -->
        <div id="pda-content" style="flex-grow: 1; overflow-y: auto; padding: 20px; border: 1px solid var(--color-outline-variant); background: rgba(0,0,0,0.3);">
          <!-- Content injected via JS -->
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
