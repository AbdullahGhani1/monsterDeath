<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE ABYSS</title>
    <link rel="stylesheet" href="/assets/styles/app.css" />
  </head>
  <body>
    <!-- Canvas for Game Rendering -->
    <canvas id="game-canvas"></canvas>

    <!-- DOM UI Overlay -->
    <div id="ui-layer">
      <section id="hud">
        <div class="health-bar">
          <label>PLAYER HP</label>
          <progress id="player-health" max="100" value="100"></progress>
        </div>
        <div class="stamina-bar">
          <label>STAMINA</label>
          <progress id="player-stamina" max="100" value="100"></progress>
        </div>
      </section>

      <section id="battle-log">
        <ul id="log-list"></ul>
      </section>

      <section id="controls">
        <button id="attack-btn">ATTACK</button>
        <button id="strong-attack-btn">STRONG ATTACK</button>
        <button id="heal-btn">HEAL</button>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
