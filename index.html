<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0a0512" />
    <title>MONSTER DEATH — Abyss Reborn</title>
    <link rel="stylesheet" href="/assets/styles/app.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <!-- In-fight HUD -->
    <div id="hud">
      <div class="hud-top">
        <div class="hud-vitals">
          <div id="hud-name" class="hud-name">CHAMPION</div>
          <div class="bar hp-bar">
            <div id="hud-hp-ghost" class="bar-ghost"></div>
            <div id="hud-hp" class="bar-fill"></div>
          </div>
          <div class="bar heat-bar">
            <div id="hud-heat" class="bar-fill"></div>
          </div>
          <div class="hud-meta-row">
            <div id="hud-heat-label" class="hud-tag">HEAT</div>
            <div id="hud-rage" class="hud-tag">RAGE</div>
          </div>
        </div>
        <div class="hud-right">
          <button id="btn-sound" class="icon-btn" title="Toggle sound">🔊</button>
          <div id="hud-souls" class="hud-souls">◈ 0</div>
          <div id="hud-chapter" class="hud-chapter"></div>
        </div>
      </div>

      <div id="hud-combo" class="hud-combo"></div>
      <div id="hud-announce" class="hud-announce"></div>

      <div id="hud-boss" class="hud-boss" style="display: none">
        <div id="hud-boss-name" class="boss-name">BOSS</div>
        <div class="bar boss-bar"><div id="hud-boss-fill" class="bar-fill"></div></div>
      </div>

      <!-- Touch controls (visible on coarse pointers) -->
      <div id="touch-layer">
        <div class="touch-pad">
          <button class="touch-btn" data-action="up">▲</button>
          <div class="touch-mid">
            <button class="touch-btn" data-action="left">◀</button>
            <button class="touch-btn" data-action="down">▼</button>
            <button class="touch-btn" data-action="right">▶</button>
          </div>
        </div>
        <div class="touch-attacks">
          <div class="touch-row">
            <button class="touch-btn atk" data-action="light">L</button>
            <button class="touch-btn atk" data-action="heavy">H</button>
          </div>
          <div class="touch-row">
            <button class="touch-btn atk" data-action="launcher">⤴</button>
            <button class="touch-btn atk sp" data-action="special">S</button>
          </div>
          <div class="touch-row">
            <button class="touch-btn util" data-action="block">🛡</button>
            <button class="touch-btn util" data-action="dash">»</button>
            <button class="touch-btn util heat" data-action="heat">Q</button>
            <button class="touch-btn util rage" data-action="rage">R</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Menus / story overlays -->
    <div id="screens"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
